name: Build desktop app

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (dmg)
          - os: windows-latest
            name: Windows (exe)
          - os: ubuntu-latest
            name: Linux (AppImage)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust host
        run: cargo build --locked --manifest-path crates/Cargo.toml --bin ompweb-host

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # Route 3 (doc 16): stage the cargo-built host into build-resources/host;
      # electron-builder ships it at <Resources>/bin/ompweb-host and
      # desktop/main.js injects OMPWEB_HOST_BIN for the standalone server.
      - name: Stage Rust host for packaging
        run: npm run host:stage

      - name: Package desktop app
        run: npx electron-builder --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates in CI: skip auto-discovery so the
          # unsigned build (same as local dev builds) succeeds.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ompweb-${{ matrix.name }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          if-no-files-found: error

  # Publish the release AFTER every platform has uploaded its assets: the
  # electron-builder GitHub publisher only accepts a DRAFT release, so the
  # draft created by publish.yml must not be flipped to "release" before the
  # slowest builder finishes (that race dropped macOS/Windows assets).
  publish-release:
    # workflow_dispatch is a verification build: retain its three platform
    # artifacts, but do not try to publish a branch named "main" as a release.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # --repo is required: this job has no checkout, so gh cannot resolve
          # the repository from a git remote ("not a git repository" failure).
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          # If no release exists yet (e.g. publish.yml draft creation raced
          # and lost), electron-builder created it itself — nothing to do.
          true
