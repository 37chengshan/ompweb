name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # The npm package is cross-platform: build the Rust host on every
  # supported platform/arch and merge the binaries into the package before
  # publish (host-bin.ts resolves <pkg>/vendor/ompweb-host/<platform>-<arch>).
  build-hosts:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust host
        run: node scripts/build-host.mjs

      - name: Stage host for npm vendor layout
        run: node scripts/stage-host.mjs --vendor

      - name: Exercise packaged host on the target OS
        run: node scripts/smoke-host-package.mjs

      - name: Archive host with executable permissions
        shell: bash
        run: tar -C vendor/ompweb-host -czf ompweb-host-${{ matrix.platform }}.tar.gz ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ompweb-host-${{ matrix.platform }}
          path: ompweb-host-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  prepare-package:
    needs: build-hosts
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Download prebuilt hosts
        uses: actions/download-artifact@v4
        with:
          path: .host-artifacts
          pattern: ompweb-host-*
          merge-multiple: true

      - name: Extract host archives
        run: |
          mkdir -p vendor/ompweb-host
          for archive in .host-artifacts/*.tar.gz; do tar -xzf "$archive" -C vendor/ompweb-host; done

      - name: Verify vendor layout
        run: |
          test -x vendor/ompweb-host/linux-x64/ompweb-host || { echo "linux-x64 host missing"; exit 1; }
          test -x vendor/ompweb-host/darwin-arm64/ompweb-host || { echo "darwin-arm64 host missing"; exit 1; }
          test -x vendor/ompweb-host/darwin-x64/ompweb-host || { echo "darwin-x64 host missing"; exit 1; }
          test -f vendor/ompweb-host/win32-x64/ompweb-host.exe || { echo "win32-x64 host missing"; exit 1; }
          ls -la vendor/ompweb-host/*/

      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm test
        timeout-minutes: 5
      - run: npm run build
      - run: node scripts/verify-host-package.mjs

      - name: Pack the verified build once
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-package
          path: '*.tgz'
          if-no-files-found: error

  verify-install:
    needs: prepare-package
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-package
          path: .npm-artifact
      - name: Install final tarball and run its native host
        shell: bash
        run: |
          npm install --omit=dev --prefix '.install smoke' ./.npm-artifact/*.tgz
          node scripts/smoke-host-package.mjs '.install smoke/node_modules/@37chengshan/ompweb'
          node '.install smoke/node_modules/@37chengshan/ompweb/bin/omp-web.js' --version

  publish:
    needs: verify-install
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-package
          path: .npm-artifact

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            VERSION="${TAG#v}"
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^" --match 'v*' 2>/dev/null || true)"

            if [ -n "$PREVIOUS_TAG" ]; then
              RANGE="$PREVIOUS_TAG..$TAG"
              CHANGELOG_URL="https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
            else
              RANGE="$TAG"
              CHANGELOG_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            fi

            CHANGES="$(
              git log --no-merges --format='• %s' "$RANGE" |
                grep -Eiv '^• ((chore: )?release( ompweb)? v?[0-9]|v?[0-9]+\.[0-9]+\.[0-9]+$)' || true
            )"
            if [ -z "$CHANGES" ]; then
              CHANGES='• Internal release maintenance.'
            fi

            {
              printf '%s\n\n' '## Changes'
              printf '%s\n\n' "$CHANGES"
              printf '%s\n\n' '## Upgrade'
              printf '%s\n' '```bash'
              printf 'npm install -g @37chengshan/ompweb@%s\n' "$VERSION"
              printf 'Desktop app: download from the release assets below (macOS dmg/zip, Windows exe, Linux AppImage). The app auto-updates from GitHub Releases on launch.\n'
              printf '%s\n\n' '```'
              printf '**Full changelog:** %s\n' "$CHANGELOG_URL"
            } > release-notes.md

            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --draft
          fi

      - name: Publish to npm
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish ./.npm-artifact/*.tgz --ignore-scripts --provenance --access public
          fi

      # Release publishing is owned by build-desktop.yml's publish-release
      # job, which runs AFTER all three platform builds uploaded their
      # assets. Flipping the draft here raced the electron-builder GitHub
      # publisher (it only accepts a draft release) and dropped macOS/
      # Windows assets.

  notify-discord:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DISCORD_WEBHOOK_URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'No release webhook configured; skipping optional notification.'
            exit 0
          fi
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*/*) ;;
            *) echo 'DISCORD_RELEASES_WEBHOOK is not a valid Discord webhook URL' >&2; exit 1 ;;
          esac

          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url)"

          jq -n \
            --arg body "$(jq -r '.body' <<<"$RELEASE_JSON")" \
            --arg title "OMPWEB $TAG" \
            --arg url "$(jq -r '.url' <<<"$RELEASE_JSON")" \
            '{
              username: "OMPWEB Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $body[0:3800],
                color: 15105570,
                footer: {text: "GitHub Release"}
              }]
            }' > discord-release.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data @discord-release.json \
            "$DISCORD_WEBHOOK_URL"
