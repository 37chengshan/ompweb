name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            VERSION="${TAG#v}"
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^" --match 'v*' 2>/dev/null || true)"

            if [ -n "$PREVIOUS_TAG" ]; then
              RANGE="$PREVIOUS_TAG..$TAG"
              CHANGELOG_URL="https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
            else
              RANGE="$TAG"
              CHANGELOG_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            fi

            CHANGES="$(
              git log --no-merges --format='• %s' "$RANGE" |
                grep -Eiv '^• ((chore: )?release( ompweb)? v?[0-9]|v?[0-9]+\.[0-9]+\.[0-9]+$)' || true
            )"
            if [ -z "$CHANGES" ]; then
              CHANGES='• Internal release maintenance.'
            fi

            {
              printf '%s\n\n' '## Changes'
              printf '%s\n\n' "$CHANGES"
              printf '%s\n\n' '## Upgrade'
              printf '%s\n' '```bash'
              printf 'npm install -g @37chengshan/ompweb@%s\n' "$VERSION"
              printf 'Desktop app: download from the release assets below (macOS dmg/zip, Windows exe, Linux AppImage). The app auto-updates from GitHub Releases on launch.\n'
              printf '%s\n\n' '```'
              printf '**Full changelog:** %s\n' "$CHANGELOG_URL"
            } > release-notes.md

            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --draft
          fi

      - name: Publish to npm
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

      # Release publishing is owned by build-desktop.yml's publish-release
      # job, which runs AFTER all three platform builds uploaded their
      # assets. Flipping the draft here raced the electron-builder GitHub
      # publisher (it only accepts a draft release) and dropped macOS/
      # Windows assets.

  notify-discord:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DISCORD_WEBHOOK_URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*/*) ;;
            *) echo 'DISCORD_RELEASES_WEBHOOK is not a valid Discord webhook URL' >&2; exit 1 ;;
          esac

          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url)"

          jq -n \
            --arg body "$(jq -r '.body' <<<"$RELEASE_JSON")" \
            --arg title "OMPWEB $TAG" \
            --arg url "$(jq -r '.url' <<<"$RELEASE_JSON")" \
            '{
              username: "OMPWEB Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $body[0:3800],
                color: 15105570,
                footer: {text: "GitHub Release"}
              }]
            }' > discord-release.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data @discord-release.json \
            "$DISCORD_WEBHOOK_URL"
