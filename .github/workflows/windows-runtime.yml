name: Windows runtime edge cases

on:
  push:
    branches: [main, codex/app-windows-qa]
    paths: ["crates/**", "scripts/test-windows-runtime.mjs", ".github/workflows/windows-runtime.yml"]
  pull_request:
    paths: ["crates/**", "scripts/test-windows-runtime.mjs", ".github/workflows/windows-runtime.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/build-host.mjs
      - name: Exercise real Windows filesystem, ACLs, locks, commands and PTY
        run: node scripts/test-windows-runtime.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-runtime-evidence
          path: windows-runtime-evidence.json
