<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* Standalone splash page — theme is applied from the app's own
     localStorage keys (omp-theme = warm-ember/nord/oled/…, omp-motion-prefs
     = {"enabled":false}), with a warm-paper default matching the app's light
     theme, so dark-theme users do not get a light flash before the app
     paints its dark BootSkeleton. */
  html[data-splash-theme="dark"] body,
  html[data-splash-theme="dark"] #overlay,
  html[data-splash-theme="dark"] #error-panel { background: #1b1916; color: #ebe6dc; }
  html[data-splash-theme="dark"] #overlay .bar { background: #3a362f; }
  html[data-splash-theme="dark"] #overlay .hint { color: #a29b8f; }
  html[data-splash-theme="dark"] #error-panel p { color: #b3ada2; }
  html[data-splash-theme="dark"] #error-panel button { border-color: #c9c2b6; background: #3a362f; color: #ebe6dc; }
  html[data-splash-theme="codex"] body,
  html[data-splash-theme="codex"] #overlay,
  html[data-splash-theme="codex"] #error-panel { background: #000000; color: #ffffff; }
  html[data-splash-theme="codex"] #overlay .logo span { color: #ffffff; }
  html[data-splash-theme="codex"] #overlay .bar { background: #27272a; }
  html[data-splash-theme="codex"] #overlay .bar i { background: #ffffff; }
  html[data-splash-theme="codex"] #overlay .hint { color: #a1a1aa; }
  html[data-splash-theme="codex"] #error-panel p { color: #a1a1aa; }
  html[data-splash-theme="codex"] #error-panel code { color: #ffffff; }
  html[data-splash-theme="codex"] #error-panel button { border-color: #3f3f46; background: #18181b; color: #ffffff; }
  html[data-splash-theme="codex"] #error-panel button.primary { background: #ffffff; border-color: #ffffff; color: #000000; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #faf9f6; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Startup overlay shown as soon as the video ends: logo + progress bar on
     the app's warm-paper background (same tokens as BootSkeleton's loading
     layer), so the splash → app transition never flashes a color jump. */
  #overlay {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #faf9f6; color: #2b2b2b;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease-in-out;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay .logo { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
  #overlay .logo span { color: #c98a1b; }
  #overlay .bar { width: 180px; height: 3px; border-radius: 2px; background: #e8e4dc; overflow: hidden; }
  #overlay .bar i { display: block; height: 100%; width: 40%; background: #c98a1b; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
  #overlay .hint { font-size: 12px; color: #8a867e; }
  /* Terminal failure panel (doc 14 T1.4): reason, log location, retry/quit.
     Shown only after the main process reports a server error. */
  #error-panel {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #faf9f6; color: #2b2b2b;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  #error-panel[hidden] { display: none; }
  #error-panel h1 { font-size: 19px; margin: 0; }
  #error-panel p { font-size: 12px; color: #6b6760; margin: 0; max-width: 420px; text-align: center; line-height: 1.6; word-break: break-word; }
  #error-panel code { font-size: 11px; color: #c98a1b; word-break: break-all; }
  #error-panel .err-row { display: flex; gap: 10px; margin-top: 8px; }
  #error-panel button { padding: 9px 22px; border-radius: 8px; border: 1px solid #3a342e; background: #e8e4dc; color: #2b2b2b; cursor: pointer; font-size: 13px; }
  #error-panel button.primary { background: #c98a1b; border-color: #c98a1b; color: #1b1916; font-weight: 600; }
  #error-panel button:disabled { opacity: 0.5; cursor: default; }
  /* Fade-out transition into the app UI */
  body.fade { opacity: 0; transition: opacity 0.55s ease-in-out; }
  /* Motion preferences: the app-level animation switch (omp-motion-prefs)
     and the OS reduced-motion setting both stop the launch shimmer; the app
     itself honors the same signals after navigation. */
  html[data-splash-motion="off"] #overlay .bar i { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #overlay .bar i { animation: none; }
    #overlay, body { transition: none; }
  }
</style>
</head>
<body>
<video id="splash" autoplay muted playsinline></video>
<div id="overlay">
  <div class="logo">Omp<span>Web</span></div>
  <div class="bar"><i></i></div>
  <div class="hint">正在启动…</div>
</div>
<div id="error-panel" hidden>
  <div class="logo">Omp<span>Web</span></div>
  <h1>启动失败</h1>
  <p id="error-msg"></p>
  <p>日志位置：<code id="error-log"></code></p>
  <div class="err-row">
    <button id="error-retry" class="primary">重试</button>
    <button id="error-quit">退出</button>
  </div>
</div>
<script>
  // Apply the app's theme + motion preference BEFORE first paint so the
  // splash never flashes the wrong colors/animations for the current user.
  // Keys match the app (hooks/useTheme.ts: "omp-theme", SettingsConfig motion
  // switch: "omp-motion-prefs" JSON {"enabled":…}). A parse failure just keeps
  // the warm-paper default — the splash is a short-lived loading surface.
  (function () {
    var root = document.documentElement;
    try {
      var theme = localStorage.getItem("omp-theme");
      if (theme === "codex") {
        root.setAttribute("data-splash-theme", "codex");
      } else {
        var dark = theme && /ember|nord|dracula|oled|pine|navy|aurora|titanium/i.test(theme);
        if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          dark = true;
        }
        if (dark) root.setAttribute("data-splash-theme", "dark");
      }
      var motion = localStorage.getItem("omp-motion-prefs");
      if (motion) {
        var prefs = JSON.parse(motion);
        if (prefs && prefs.enabled === false) root.setAttribute("data-splash-motion", "off");
      }
    } catch (e) { /* file:// or disabled storage — defaults apply */ }
  })();
</script>
<script>
  const video = document.getElementById("splash");
  const overlay = document.getElementById("overlay");
  const params = new URLSearchParams(location.search);
  const appUrl = params.get("app");
  const videoSrc = params.get("video");
  if (videoSrc) video.src = videoSrc;

  // Navigation happens ONLY when the standalone server answers (the main
  // process polls it and broadcasts "server-ready"); until then the overlay
  // (logo + progress bar) stays up after the video ends or is skipped.
  let serverReady = false;
  let videoEnded = false;
  let faded = false;
  let skipRequested = false;
  let overlayShownAt = 0;

  function go() {
    if (faded) return;
    faded = true;
    document.body.classList.add("fade");
    const isReduced = (document.documentElement.getAttribute("data-splash-motion") === "off") ||
      (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    setTimeout(() => {
      if (appUrl) location.href = appUrl;
      else window.close();
    }, isReduced ? 20 : 560);
  }

  function showOverlay(immediate = false) {
    if (videoEnded) return;
    videoEnded = true;
    video.pause();
    if (immediate) {
      video.style.visibility = "hidden";
      overlay.style.transition = "none";
      overlay.classList.add("show");
      overlayShownAt = performance.now();
      requestAnimationFrame(() => { overlay.style.transition = ""; });
    } else {
      overlay.classList.add("show");
      overlayShownAt = performance.now();
      setTimeout(() => {
        video.style.visibility = "hidden";
      }, 350);
    }
  }

  function tryGo() {
    // Never navigate onto a cold server. A skip only changes the splash
    // presentation; it cannot bypass readiness.
    if (faded) return;
    if (!serverReady) return;
    if (!videoEnded && !skipRequested) return;
    // Let the logo layer become fully visible before fading the splash away.
    const remainingOverlayMs = Math.max(0, 80 - (performance.now() - overlayShownAt));
    setTimeout(go, remainingOverlayMs);
  }

  // Desktop app: the main process tells us when the server is listening.
  if (window.ompWebDesktop && typeof window.ompWebDesktop.onServerReady === "function") {
    window.ompWebDesktop.onServerReady(() => {
      serverReady = true;
      tryGo();
    });
    void window.ompWebDesktop.isServerReady?.()
      .then((ready) => { if (ready) { serverReady = true; tryGo(); } })
      .catch(() => {});
  }
  // Terminal failure (T1.4): stop the animation and show the error panel.
  const errorPanel = document.getElementById("error-panel");
  const bridge = window.ompWebDesktop;
  if (bridge && typeof bridge.onServerError === "function") {
    bridge.onServerError((payload) => {
      serverReady = false;
      // The body may be mid-fade (opacity 0) from a failed navigation —
      // undo it so the error panel is actually visible.
      document.body.classList.remove("fade");
      video.pause();
      video.style.visibility = "hidden";
      overlay.classList.remove("show");
      document.getElementById("error-msg").textContent = (payload && (payload.detail || payload.reason)) || "内部服务未能就绪";
      document.getElementById("error-log").textContent = (payload && payload.logPath) || "应用日志目录";
      errorPanel.hidden = false;
    });
    document.getElementById("error-retry").onclick = () => {
      const btn = document.getElementById("error-retry");
      btn.disabled = true;
      btn.textContent = "正在重试…";
      bridge.retryStartup().then((r) => {
        btn.disabled = false;
        btn.textContent = "重试";
        if (r && r.ok) {
          // Wait for the server-ready event; tryGo() fades into the app.
          errorPanel.hidden = true;
          showOverlay();
        }
      }).catch(() => {
        btn.disabled = false;
        btn.textContent = "重试";
      });
    };
    document.getElementById("error-quit").onclick = () => { if (bridge.close) bridge.close(); else window.close(); };
  }


  // Trimmed to 8s (first/last second cut), played at 1.6x -> ~5s launch.
  video.playbackRate = 1.6;
  let playStarted = false;
  video.addEventListener("loadedmetadata", () => {
    const d = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 8;
    console.log("splash metadata duration=" + d + " rate=" + video.playbackRate);
    if (playStarted) return;
    playStarted = true;
    setTimeout(showOverlay, (d / video.playbackRate) * 1000 + 150);
  });
  video.addEventListener("ended", () => showOverlay(false));
  video.addEventListener("error", () => {
    console.log("splash video error: " + (video.error ? video.error.code : "?"));
    showOverlay(true);
  });

  // Warm the app UI while the video plays: the standalone server's first
  // request does one-time initialization, and the JS/CSS bundles need to be
  // in the HTTP cache — otherwise navigation lands on a blank page for ~1s.
  async function warmUp() {
    if (!appUrl) return;
    for (let attempt = 0; attempt < 12; attempt++) {
      try {
        const res = await fetch(appUrl, { cache: "force-cache" });
        if (res.ok) {
          const html = await res.text();
          const assets = [...html.matchAll(/(?:src|href)="(\/_next\/static\/[^"]+\.(?:js|css))"/g)].map((m) => m[1]);
          for (const a of assets.slice(0, 40)) {
            fetch(new URL(a, appUrl).toString(), { cache: "force-cache" }).catch(() => {});
          }
          console.log("splash warm: " + assets.length + " assets");
          // T1.3 stage: splash finished pre-warming the app assets.
          bridge?.startupStage?.("assets_warmed");
          return;
        }
      } catch { /* server not up yet */ }
      await new Promise((r) => setTimeout(r, 700));
    }
  }
  void warmUp();

  const prefersReduced = (document.documentElement.getAttribute("data-splash-motion") === "off") ||
    (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (prefersReduced) {
    skipRequested = true;
    showOverlay(true);
  } else {
    video.play().catch((e) => {
      console.log("splash play rejected: " + e);
      showOverlay(true);
    });
  }

  // Hard fallbacks end the video but still wait for the server: the loading
  // layer must remain visible rather than navigating to a blank/error page.
  setTimeout(() => {
    skipRequested = true;
    showOverlay();
    tryGo();
  }, 8000);
  document.body.addEventListener("click", () => {
    skipRequested = true;
    showOverlay(true);
    tryGo();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.key === "Enter" || e.key === " ") {
      skipRequested = true;
      showOverlay(true);
      tryGo();
    }
  });
</script>
</body>
</html>
