<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Fade-out transition into the app UI */
  body.fade { opacity: 0; transition: opacity 0.55s ease-in-out; }
</style>
</head>
<body>
<video id="splash" autoplay muted playsinline></video>
<script>
  const video = document.getElementById("splash");
  const params = new URLSearchParams(location.search);
  const appUrl = params.get("app");
  const videoSrc = params.get("video");
  if (videoSrc) video.src = videoSrc;

  let faded = false;
  function fadeIntoApp() {
    if (faded) return;
    faded = true;
    document.body.classList.add("fade");
    setTimeout(() => {
      if (appUrl) location.href = appUrl;
      else window.close();
    }, 560);
  }

  // Trimmed to 8s (first/last second cut), played at 1.6x -> ~5s launch.
  video.playbackRate = 1.6;
  // Timed transition is the source of truth — ended can fire early on some
  // codecs/containers, which made the launch "flash past".
  let playStarted = false;
  video.addEventListener("loadedmetadata", () => {
    const d = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 8;
    console.log("splash metadata duration=" + d + " rate=" + video.playbackRate);
    if (playStarted) return;
    playStarted = true;
    setTimeout(fadeIntoApp, (d / video.playbackRate) * 1000 + 150);
  });
  video.addEventListener("error", () => console.log("splash video error: " + (video.error ? video.error.code : "?")));
  video.addEventListener("playing", () => {
    console.log("splash playing");
    // Warm the app UI (HTML + static assets) while the video plays so the
    // post-fade navigation lands on a rendered page instead of a blank one.
    if (appUrl) fetch(appUrl, { cache: "force-cache" }).catch(() => {});
  });
  video.addEventListener("ended", fadeIntoApp);
  video.play().catch((e) => console.log("splash play rejected: " + e));
  // Fallback: never leave the launch animation hanging.
  setTimeout(fadeIntoApp, 8000);
  document.body.addEventListener("click", fadeIntoApp);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") fadeIntoApp(); });
</script>
</body>
</html>
