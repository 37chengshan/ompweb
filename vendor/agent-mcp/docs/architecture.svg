<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#EFECE4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C0503A"/>
      <stop offset="1" stop-color="#9C3D2C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2E2A22" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#2E2A22">Agent MCP 架构</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#6E675A">打通所有 Agent CLI 壁垒 · 一个 MCP 协议 · 任意 CLI 工作池</text>

  <!-- 主 Agent -->
  <g filter="url(#shadow)">
    <rect x="340" y="96" width="280" height="64" rx="12" fill="#FFFFFF" stroke="#C0503A" stroke-width="2"/>
    <text x="480" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#2E2A22">主 Agent</text>
    <text x="480" y="146" text-anchor="middle" font-size="11" fill="#6E675A">codex / claude / omp … 只做拆解与汇合</text>
  </g>

  <!-- MCP 薄层 -->
  <g filter="url(#shadow)">
    <rect x="330" y="196" width="300" height="86" rx="12" fill="#FFFFFF" stroke="#9C3D2C" stroke-width="1.5"/>
    <text x="480" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#9C3D2C">mcp_server.py · MCP 薄层</text>
    <text x="480" y="244" text-anchor="middle" font-size="11" fill="#6E675A">12 个工具（编排 + 记忆） · host 识别 · 会话隔离</text>
    <text x="480" y="262" text-anchor="middle" font-size="11" fill="#6E675A">无 daemon 时原子拉起 · stdio 零依赖</text>
  </g>

  <!-- 箭头：主 Agent → MCP -->
  <line x1="480" y1="160" x2="480" y2="192" stroke="#C0503A" stroke-width="2" marker-end="url(#arrowA)"/>
  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C0503A"/>
    </marker>
  </defs>

  <!-- daemon -->
  <g filter="url(#shadow)">
    <rect x="250" y="318" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#9C3D2C" stroke-width="1.5"/>
    <text x="480" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#2E2A22">daemon_main.py · 常驻守护进程</text>
    <text x="480" y="372" text-anchor="middle" font-size="11" fill="#6E675A">槽位 / 排队 / 心跳 / 看护 · 验证回投 · token 降档 · 结果缓存</text>
    <text x="480" y="396" text-anchor="middle" font-size="11" fill="#6E675A">SQLite 状态机持久化 · SSE 事件广播 · HTTP 127.0.0.1:8765</text>
  </g>

  <!-- 箭头：MCP → daemon -->
  <line x1="480" y1="282" x2="480" y2="314" stroke="#9C3D2C" stroke-width="2" marker-end="url(#arrowB)"/>
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9C3D2C"/>
    </marker>
    <marker id="arrowW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8B867A"/>
    </marker>
  </defs>

  <!-- 监控页 -->
  <g filter="url(#shadow)">
    <rect x="740" y="318" width="190" height="86" rx="12" fill="#FFFFFF" stroke="#3E7A56" stroke-width="1.5"/>
    <text x="835" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#3E7A56">监控页（只读）</text>
    <text x="835" y="364" text-anchor="middle" font-size="10.5" fill="#6E675A">单文件 · 零外部依赖</text>
    <text x="835" y="382" text-anchor="middle" font-size="10.5" fill="#6E675A">SSE 直播 + 对话图</text>
  </g>
  <line x1="710" y1="360" x2="736" y2="360" stroke="#3E7A56" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- CLI worker 池 -->
  <text x="480" y="474" text-anchor="middle" font-size="12" fill="#6E675A">统一事件流归一化：agent.spawned → running → message / usage → terminated</text>
  <g>
    <g filter="url(#shadow)">
      <rect x="52" y="500" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#8A4B2E" stroke-width="1.5"/>
      <circle cx="80" cy="524" r="10" fill="#8A4B2E"/>
      <text x="80" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">c</text>
      <text x="127" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A22">claude</text>
      <text x="127" y="550" text-anchor="middle" font-size="10" fill="#6E675A">stream-json</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="218" y="500" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#9A7B2F" stroke-width="1.5"/>
      <circle cx="246" cy="524" r="10" fill="#9A7B2F"/>
      <text x="246" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">g</text>
      <text x="293" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A22">grok</text>
      <text x="293" y="550" text-anchor="middle" font-size="10" fill="#6E675A">streaming-messages</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="384" y="500" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#3E7A56" stroke-width="1.5"/>
      <circle cx="412" cy="524" r="10" fill="#3E7A56"/>
      <text x="412" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">o</text>
      <text x="459" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A22">opencode</text>
      <text x="459" y="550" text-anchor="middle" font-size="10" fill="#6E675A">run --format json</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="550" y="500" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#5A54A3" stroke-width="1.5"/>
      <circle cx="578" cy="524" r="10" fill="#5A54A3"/>
      <text x="578" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">o</text>
      <text x="625" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A22">omp</text>
      <text x="625" y="550" text-anchor="middle" font-size="10" fill="#6E675A">--mode json / rpc</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="716" y="500" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#286ca6" stroke-width="1.5"/>
      <circle cx="744" cy="524" r="10" fill="#286ca6"/>
      <text x="744" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">a</text>
      <text x="791" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2A22">atomcode</text>
      <text x="791" y="550" text-anchor="middle" font-size="10" fill="#6E675A">task-only · one-shot</text>
    </g>
  </g>

  <!-- daemon → workers -->
  <line x1="300" y1="438" x2="120" y2="496" stroke="#8B867A" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <line x1="380" y1="438" x2="290" y2="496" stroke="#8B867A" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <line x1="480" y1="438" x2="459" y2="496" stroke="#8B867A" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <line x1="580" y1="438" x2="625" y2="496" stroke="#8B867A" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <line x1="660" y1="438" x2="791" y2="496" stroke="#8B867A" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <!-- 底部 -->
  <text x="480" y="616" text-anchor="middle" font-size="11" fill="#8B867A">spawn_agent / steer / followup / wait / interrupt · 任务级超时终止进程树 · 可 resume 续接</text>
</svg>
