<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#EFECE4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2E2A22" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9C3D2C"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#2E2A22">Agent MCP 编排流程</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#6E675A">复杂度分级门 → 拆解规划 → 判定并行 → 派发监控 → 汇合自审</text>

  <!-- 第零步：复杂度分级门 -->
  <g filter="url(#shadow)">
    <rect x="280" y="92" width="400" height="86" rx="14" fill="#FFFFFF" stroke="#C0503A" stroke-width="2"/>
    <text x="480" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#C0503A">第零步 · 复杂度分级门</text>
    <text x="480" y="140" text-anchor="middle" font-size="11" fill="#6E675A">estimate_complexity 本地直算（零 token、不 spawn）</text>
    <text x="480" y="160" text-anchor="middle" font-size="11" fill="#6E675A">S 直接做 · M 至多拆 1 · L 才走完整编排 —— 默认不拆，按需才拆</text>
  </g>

  <!-- 不委派分支 -->
  <g filter="url(#shadow)">
    <rect x="90" y="220" width="190" height="64" rx="12" fill="#F6E3DB" stroke="#C0503A" stroke-width="1.5"/>
    <text x="185" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#9C3D2C">命中不委派清单</text>
    <text x="185" y="266" text-anchor="middle" font-size="10.5" fill="#6E675A">两行小改 / 单文件 / 快速问答</text>
  </g>
  <line x1="480" y1="178" x2="185" y2="216" stroke="#C0503A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="202" font-size="10.5" fill="#9C3D2C">是</text>

  <!-- 第一步：拆解规划 -->
  <g filter="url(#shadow)">
    <rect x="330" y="212" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#9C3D2C" stroke-width="1.5"/>
    <text x="480" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#2E2A22">第一步 · 拆解规划</text>
    <text x="480" y="260" text-anchor="middle" font-size="11" fill="#6E675A">最小必要步骤：标注读密集 / 写密集</text>
  </g>
  <line x1="480" y1="178" x2="480" y2="208" stroke="#9C3D2C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="494" y="198" font-size="10.5" fill="#3E7A56">否 → 进入编排</text>

  <!-- 第二步：判定并行 -->
  <g filter="url(#shadow)">
    <rect x="330" y="316" width="300" height="86" rx="12" fill="#FFFFFF" stroke="#9C3D2C" stroke-width="1.5"/>
    <text x="480" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#2E2A22">第二步 · 判定并行（关键）</text>
    <text x="480" y="364" text-anchor="middle" font-size="11" fill="#6E675A">认知局部性优先：无数据依赖 → 并行派发</text>
    <text x="480" y="382" text-anchor="middle" font-size="11" fill="#6E675A">写同批文件 → 串行 · 有依赖 → 父先跑传 context</text>
  </g>
  <line x1="480" y1="284" x2="480" y2="312" stroke="#9C3D2C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 第三步：MCP 式派发 -->
  <g filter="url(#shadow)">
    <rect x="330" y="434" width="300" height="86" rx="12" fill="#FFFFFF" stroke="#9C3D2C" stroke-width="1.5"/>
    <text x="480" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#2E2A22">第三步 · MCP 式派发</text>
    <text x="480" y="482" text-anchor="middle" font-size="11" fill="#6E675A">spawn_agent 并发调多个（可 steer / followup）</text>
    <text x="480" y="500" text-anchor="middle" font-size="11" fill="#6E675A">prompt = 角色预设 + 任务简报六要素</text>
  </g>
  <line x1="480" y1="402" x2="480" y2="430" stroke="#9C3D2C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 派发 → worker 池 -->
  <text x="480" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#2E2A22">任意 CLI 工作池</text>
  <g>
    <g filter="url(#shadow)">
      <rect x="150" y="568" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#8A4B2E" stroke-width="1.5"/>
      <text x="210" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#8A4B2E">claude</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="285" y="568" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#9A7B2F" stroke-width="1.5"/>
      <text x="345" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#9A7B2F">grok</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="420" y="568" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#3E7A56" stroke-width="1.5"/>
      <text x="480" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#3E7A56">opencode</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="555" y="568" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#5A54A3" stroke-width="1.5"/>
      <text x="615" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#5A54A3">omp</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="690" y="568" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#286ca6" stroke-width="1.5"/>
      <text x="750" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#286ca6">atomcode</text>
    </g>
  </g>

  <!-- 第四步：监控 -->
  <g filter="url(#shadow)">
    <rect x="60" y="316" width="220" height="86" rx="12" fill="#FFFFFF" stroke="#3E7A56" stroke-width="1.5"/>
    <text x="170" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#3E7A56">第四步 · 监控</text>
    <text x="170" y="364" text-anchor="middle" font-size="10.5" fill="#6E675A">wait_agent 短阻塞循环（默认 25s）</text>
    <text x="170" y="382" text-anchor="middle" font-size="10.5" fill="#6E675A">超时读存活证据：pid + 日志增长</text>
  </g>
  <line x1="330" y1="477" x2="284" y2="398" stroke="#3E7A56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 第五步：汇合自审 -->
  <g filter="url(#shadow)">
    <rect x="680" y="316" width="220" height="86" rx="12" fill="#FFFFFF" stroke="#5A54A3" stroke-width="1.5"/>
    <text x="790" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#5A54A3">第五步 · 汇合自审</text>
    <text x="790" y="364" text-anchor="middle" font-size="10.5" fill="#6E675A">FINAL_ANSWER 摘要回传（≤3 行）</text>
    <text x="790" y="382" text-anchor="middle" font-size="10.5" fill="#6E675A">三查评判：对目标 / 查证据 / 判返工</text>
  </g>
  <line x1="630" y1="477" x2="676" y2="398" stroke="#5A54A3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 监控/汇合 → worker 池 连线 -->
  <line x1="170" y1="402" x2="210" y2="564" stroke="#8B867A" stroke-width="1.5"/>
  <line x1="790" y1="402" x2="750" y2="564" stroke="#8B867A" stroke-width="1.5"/>

  <!-- 底部注解 -->
  <text x="480" y="664" text-anchor="middle" font-size="11" fill="#8B867A">任务级超时终止进程树 · 失败可 resume 续接 · token 超额自动降档重跑 · verify_command 自动验证回投</text>
</svg>
